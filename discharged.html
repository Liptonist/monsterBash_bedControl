<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>退室済み一覧 | 救護所</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;color:#1a1a1a;font-size:14px;background:#f5f5f5}
.hdr{background:#fff;border-bottom:1px solid #e0e0e0;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.hdr-title{font-size:15px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back-link{font-size:12px;color:#3b82f6;text-decoration:none;padding:5px 10px;border:1px solid #93c5fd;border-radius:6px;background:#eff6ff}
.back-link:hover{background:#dbeafe}
.dot{width:8px;height:8px;border-radius:50%;background:#9e9e9e;flex-shrink:0;transition:background .3s}
.dot.online{background:#22c55e;animation:blink 2s infinite}
.dot.offline{background:#ef4444}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.sync-label{font-size:11px;color:#888}
.content{padding:14px}
.summary{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.sum-card{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:10px 16px;text-align:center;min-width:80px}
.sum-num{font-size:22px;font-weight:600;color:#3b82f6}
.sum-lbl{font-size:11px;color:#888;margin-top:2px}
.filter-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.filter-label{font-size:12px;color:#666}
.filter-select{font-size:12px;padding:5px 8px;border:1px solid #ccc;border-radius:6px;background:#fff;color:#1a1a1a}
.empty-msg{text-align:center;color:#aaa;padding:40px;font-size:13px}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
table{width:100%;min-width:680px;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden}
thead{background:#f0f4ff}
th{font-size:11px;font-weight:600;color:#555;padding:9px 10px;text-align:left;border-bottom:1px solid #e0e0e0;white-space:nowrap}
td{font-size:12px;padding:9px 10px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
.pid{font-size:10px;padding:2px 6px;border-radius:4px;background:#f0fdf4;border:1px solid #86efac;color:#166534;font-weight:500}
.room-badge{font-size:10px;padding:2px 6px;border-radius:4px;background:#eff6ff;border:1px solid #93c5fd;color:#1e40af;font-weight:500}
.slot-badge{font-size:10px;padding:2px 6px;border-radius:4px;background:#f5f5f5;border:1px solid #ccc;color:#555;font-weight:500}
.stay{font-weight:500;color:#374151}
.stay.long{color:#dc2626}
.del-btn{background:none;border:1px solid #fca5a5;border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer;color:#dc2626;line-height:1}
.del-btn:hover{background:#fee2e2}
.restore-btn{background:none;border:1px solid #93c5fd;border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer;color:#1e40af;white-space:nowrap}
.restore-btn:hover{background:#eff6ff}
.trash-section{margin-top:24px}
.trash-heading{font-size:13px;font-weight:600;color:#888;margin-bottom:8px;padding-top:14px;border-top:1px solid #e0e0e0}
.trash-wrap{opacity:.7}
.close-section{margin-top:28px;padding-top:16px;border-top:1px solid #e0e0e0}
.close-h{font-size:13px;font-weight:600;color:#888;margin-bottom:10px}
.close-body{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:14px}
.close-now{font-size:13px;margin-bottom:10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.mono{font-family:monospace;background:#f1f3f4;border-radius:4px;padding:1px 6px;font-size:12px}
.link-btn{background:none;border:none;color:#3b82f6;font-size:11.5px;cursor:pointer;text-decoration:underline;padding:0}
.fest-issued{font-size:11.5px;color:#888}
.fest-form{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;font-size:12.5px;color:#555}
.fest-form input{width:80px;padding:5px 8px;border:1px solid #ccc;border-radius:6px;font-size:13px;font-family:inherit;margin-left:4px}
.btn-sm{background:none;border:1px solid #d0d0d0;color:#555;padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer}
.btn-sm:hover{background:#f5f5f5}
.close-desc{font-size:12px;color:#777;line-height:1.8;margin-bottom:12px}
.btn-close{background:#d97706;border:none;color:#fff;font-size:13px;font-weight:600;padding:10px 20px;border-radius:8px;cursor:pointer}
.btn-close:hover{background:#b45309}
.btn-close:disabled{opacity:.5;cursor:default}
.msg{border-radius:8px;padding:9px 12px;font-size:12.5px;line-height:1.7;margin-bottom:12px;display:none;word-break:break-all}
.msg.err{background:#fdecea;border:1px solid #f5c6c2;color:#b3261e;display:block}
.msg.ok{background:#e8f5e9;border:1px solid #b7e0ba;color:#256029;display:block}
.offline-banner{display:none;background:#fef3c7;border-bottom:1px solid #fcd34d;padding:6px 14px;font-size:12px;color:#92400e;text-align:center}
.offline-banner.show{display:block}
</style>
</head>
<body>

<div class="offline-banner" id="offline-banner">⚠️ オフライン中 — 回線復帰時に最新データが表示されます</div>

<div class="hdr">
  <a class="back-link" href="index.html">← 戻る</a>
  <span class="hdr-title">📋 退室済み一覧</span>
  <span class="hdr-user" id="hdr-user"></span>
  <button class="hdr-logout" id="hdr-logout" style="display:none">ログアウト</button>
  <div class="dot" id="sync-dot"></div>
  <span class="sync-label" id="sync-label">接続中...</span>
</div>

<div class="content">
  <div class="summary" id="summary"></div>
  <div class="filter-row">
    <span class="filter-label">絞り込み：</span>
    <select class="filter-select" id="filter-room" onchange="applyFilter()">
      <option value="">全部屋</option>
      <option>本部</option>
      <option>空海横</option>
      <option>サーカス</option>
      <option>茶堂</option>
    </select>
    <select class="filter-select" id="filter-kind" onchange="applyFilter()">
      <option value="">全種別</option>
      <option value="ベッド">ベッド</option>
      <option value="室内椅子">室内椅子</option>
      <option value="室外椅子">室外椅子</option>
    </select>
  </div>
  <div id="table-area"></div>

  <div class="trash-section">
    <div class="trash-heading">🗑️ ゴミ箱（<span id="trash-count">0</span>件）</div>
    <div class="trash-wrap" id="trash-area"></div>
  </div>

  <!-- 日次の締め（管理者のみ） -->
  <div class="close-section" id="close-section" style="display:none">
    <div class="close-h">📦 日次の締め</div>
    <div class="close-body">
      <div class="close-now">
        現在の開催日：<b id="fest-now">—</b>
        　次に発行：<span id="fest-sample" class="mono">—</span>
        <span class="fest-issued">本日 <b id="fest-issued">0</b> 件発行済み</span>
        <button class="link-btn" id="fest-edit">開催年・日を修正</button>
      </div>
      <div class="fest-form" id="fest-form" style="display:none">
        <label>開催年 <input type="number" id="fest-year" min="2000" max="2100" step="1"></label>
        <label>開催日 <input type="number" id="fest-day" min="1" max="10" step="1"></label>
        <button class="btn-sm" id="fest-save">保存</button>
        <button class="btn-sm" id="fest-cancel">やめる</button>
      </div>
      <div class="close-desc">
        その日の <b>退室済み一覧</b> と <b>ゴミ箱</b> をまとめて保存し、この画面から消します。
        患者IDの連番は1に戻り、開催日が1つ進みます（翌日は <span class="mono" id="fest-next">—</span> から）。
        保存した内容は「保存済みの記録」ページでいつでも見られます。
      </div>
      <div class="msg" id="close-msg"></div>
      <button class="btn-close" id="btn-close-day">この日を締める</button>
    </div>
  </div>
</div>

<script type="module">
import { ref, onValue, set, remove, update, get }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { db, me, requireAuth, logChange, trackWrite,
         festival, subscribeFestival, pidShort } from './app-common.js';

let allRecords = [];

function tsToHHMM(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
}

let trashRecords = [];

// 認証が通ってから購読を開始する（startApp から呼ばれる）
function subscribeAll() {
  onValue(ref(db, '.info/connected'), snap => {
    const online = snap.val() === true;
    document.getElementById('sync-dot').className = 'dot ' + (online ? 'online' : 'offline');
    document.getElementById('sync-label').textContent = online ? 'リアルタイム同期中' : 'オフライン';
    document.getElementById('offline-banner').classList.toggle('show', !online);
  });

  onValue(ref(db, 'kyuugo/discharged'), snap => {
    const data = snap.val();
    if (!data) { allRecords = []; render([]); return; }
    // Firebaseのpushキーでソート（新しい順）
    allRecords = Object.entries(data)
      .map(([k, v]) => ({...v, _key: k}))
      .sort((a,b) => (b.recordedAt||0) - (a.recordedAt||0));
    applyFilter();
  });

  onValue(ref(db, 'kyuugo/discharged_trash'), snap => {
    const data = snap.val();
    trashRecords = data
      ? Object.entries(data).map(([k, v]) => ({...v, _key: k})).sort((a,b) => (b.trashedAt||0) - (a.trashedAt||0))
      : [];
    renderTrash();
  });
}

function applyFilter() {
  const room = document.getElementById('filter-room').value;
  const kind = document.getElementById('filter-kind').value;
  const filtered = allRecords.filter(r =>
    (!room || r.room === room) &&
    (!kind || r.kind === kind)
  );
  render(filtered);
}
window.applyFilter = applyFilter;

function render(records) {
  // サマリー
  document.getElementById('summary').innerHTML = `
    <div class="sum-card"><div class="sum-num">${allRecords.length}</div><div class="sum-lbl">総退室数</div></div>
    <div class="sum-card"><div class="sum-num">${avgStay(allRecords)}</div><div class="sum-lbl">平均滞在(分)</div></div>
    <div class="sum-card"><div class="sum-num">${countRoom(allRecords,'本部')}</div><div class="sum-lbl">本部</div></div>
    <div class="sum-card"><div class="sum-num">${countRoom(allRecords,'空海横')}</div><div class="sum-lbl">空海横</div></div>
    <div class="sum-card"><div class="sum-num">${countRoom(allRecords,'サーカス')}</div><div class="sum-lbl">サーカス</div></div>
    <div class="sum-card"><div class="sum-num">${countRoom(allRecords,'茶堂')}</div><div class="sum-lbl">茶堂</div></div>
  `;

  document.getElementById('table-area').innerHTML =
    records.length === 0
      ? `<div class="empty-msg">退室済みの記録はまだありません</div>`
      : tableHTML(records, 'trash');
}

function renderTrash() {
  document.getElementById('trash-count').textContent = trashRecords.length;
  document.getElementById('trash-area').innerHTML =
    trashRecords.length === 0
      ? `<div class="empty-msg">ゴミ箱は空です</div>`
      : tableHTML(trashRecords, 'restore');
}

function recordRowHTML(r, action) {
  const stay = r.stayMins != null ? r.stayMins : '—';
  const stayClass = r.stayMins >= 30 ? 'stay long' : 'stay';
  let actionCell = '';
  if (action === 'trash') actionCell = `<td><button class="del-btn" onclick="moveToTrash('${r._key}')" title="ゴミ箱に移動">🗑️</button></td>`;
  else if (action === 'restore') actionCell = `<td><button class="restore-btn" onclick="restoreFromTrash('${r._key}')" title="一覧に戻す">↩️ 戻す</button></td>`;
  return `<tr>
    <td>${pidShort(r) ? `<span class="pid">${pidShort(r)}</span>` : '—'}</td>
    <td>${r.name || '—'}</td>
    <td>${r.sym || '—'}</td>
    <td><span class="room-badge">${r.room||'—'}</span></td>
    <td><span class="slot-badge">${r.slotId||'—'}</span></td>
    <td>${r.kind||'—'}</td>
    <td>${tsToHHMM(r.enteredAt)}</td>
    <td>${tsToHHMM(r.exitedAt)}</td>
    <td class="${stayClass}">${stay !== '—' ? stay+'分' : '—'}</td>
    ${actionCell}
  </tr>`;
}

function tableHTML(records, action) {
  const rows = records.map(r => recordRowHTML(r, action)).join('');
  return `
    <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th>患者ID</th>
          <th>患者名</th>
          <th>症状</th>
          <th>部屋</th>
          <th>席ID</th>
          <th>種別</th>
          <th>入室</th>
          <th>退室</th>
          <th>滞在時間</th>
          ${action ? '<th>操作</th>' : ''}
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    </div>`;
}

function moveToTrash(key) {
  if (!confirm('この記録をゴミ箱に移動しますか？')) return;
  const rec = allRecords.find(r => r._key === key);
  if (!rec) return;
  const { _key, ...data } = rec;
  trackWrite(
    set(ref(db, 'kyuugo/discharged_trash/' + key), { ...data, trashedAt: Date.now() })
      .then(() => {
        logChange('ゴミ箱へ移動', recLabel(rec), recDetail(rec));
        return remove(ref(db, 'kyuugo/discharged/' + key));
      })
  ).catch(() => {});
}
window.moveToTrash = moveToTrash;

function restoreFromTrash(key) {
  if (!confirm('この記録を一覧に戻しますか？')) return;
  const rec = trashRecords.find(r => r._key === key);
  if (!rec) return;
  const { _key, trashedAt, ...data } = rec;
  trackWrite(
    set(ref(db, 'kyuugo/discharged/' + key), data)
      .then(() => {
        logChange('一覧に戻す', recLabel(rec), recDetail(rec));
        return remove(ref(db, 'kyuugo/discharged_trash/' + key));
      })
  ).catch(() => {});
}

// 変更履歴用に退室記録を要約する
function recLabel(r) {
  return [r.room, r.kind && r.slotId ? r.kind + r.slotId : r.slotId].filter(Boolean).join(' ') || '退室記録';
}
function recDetail(r) {
  return [
    pidShort(r) || null,
    r.name || null,
    r.triage || null,
    r.stayMins != null ? `滞在${r.stayMins}分` : null,
  ].filter(Boolean).join(' / ');
}
window.restoreFromTrash = restoreFromTrash;

function avgStay(records) {
  const valid = records.filter(r => r.stayMins != null);
  if (!valid.length) return '—';
  return Math.round(valid.reduce((s,r) => s+r.stayMins, 0) / valid.length);
}
function countRoom(records, room) {
  return records.filter(r => r.room === room).length;
}

// ─── 日次の締め（管理者のみ） ────────────────────────
const $c = id => document.getElementById(id);

// 次に発行される連番。kyuugo/globalPatientId は「最後に発行した番号」
let nextSeq = 1;

function renderFestival() {
  // 画面には年を省いた形で出す（保存されるIDには年が入る）
  $c('fest-now').textContent = `${festival.year}年 ${festival.day}日目`;
  $c('fest-sample').textContent = `${festival.day}-${String(nextSeq).padStart(3, '0')}`;
  $c('fest-issued').textContent = String(nextSeq - 1);
  $c('fest-next').textContent   = `${festival.day + 1}-001`;
}

function closeMsg(text, kind) {
  const el = $c('close-msg');
  el.className = 'msg ' + kind;
  el.textContent = text;
}

// 入室中（空きでない）の枠数を数える
function countOccupied(roomsVal) {
  const asArray = v => Array.isArray(v) ? v : Object.values(v || {});
  let n = 0;
  asArray(roomsVal).forEach(room => {
    ['beds', 'chairsIn', 'chairsOut'].forEach(k => {
      asArray(room && room[k]).forEach(it => {
        if (it && it.status && it.status !== 'empty') n++;
      });
    });
  });
  return n;
}

async function closeDay() {
  $c('close-msg').className = 'msg';
  const key = `${festival.year}-${festival.day}`;

  let existing, roomsVal;
  try {
    [existing, roomsVal] = await Promise.all([
      get(ref(db, 'kyuugo/archives/' + key)),
      get(ref(db, 'kyuugo/rooms')),
    ]);
  } catch (e) {
    closeMsg('確認できませんでした: ' + (e.code || e.message), 'err'); return;
  }

  if (existing.exists()) {
    closeMsg(`${key} はすでに保存済みです。開催年・日を修正してからやり直してください。`, 'err');
    return;
  }

  const occupied = countOccupied(roomsVal.val());
  const lines = [
    `${festival.year}年 ${festival.day}日目 を締めます。`,
    '',
    `退室済み: ${allRecords.length}件`,
    `ゴミ箱:   ${trashRecords.length}件`,
    '',
    'これらを保存済みの記録に移し、この画面から消します。',
    `患者IDの連番は1に戻り、翌日は ${festival.year}-${festival.day + 1}-001 から始まります。`,
  ];
  if (occupied > 0) {
    lines.push('',
      `⚠️ 入室中の枠が ${occupied} 件あります。`,
      'この患者は今日のIDを持ったまま翌日に残るため、番号が重複する可能性があります。',
      '先に退室処理をしてから締めることをおすすめします。');
  }
  lines.push('', '実行してよろしいですか？');
  if (!confirm(lines.join('\n'))) return;

  const btn = $c('btn-close-day');
  btn.disabled = true;
  try {
    // 保存・消去・採番リセット・日付繰り上げを1回の更新でまとめて行う
    const updates = {};
    updates['kyuugo/archives/' + key] = {
      year: festival.year,
      day: festival.day,
      label: `${festival.year}年 ${festival.day}日目`,
      archivedAt: Date.now(),
      archivedBy: me.name,
      dischargedCount: allRecords.length,
      trashCount: trashRecords.length,
      discharged: allRecords.length
        ? Object.fromEntries(allRecords.map(({_key, ...v}) => [_key, v])) : null,
      discharged_trash: trashRecords.length
        ? Object.fromEntries(trashRecords.map(({_key, ...v}) => [_key, v])) : null,
    };
    updates['kyuugo/discharged'] = null;
    updates['kyuugo/discharged_trash'] = null;
    updates['kyuugo/globalPatientId'] = 0;
    updates['kyuugo/festival/day'] = festival.day + 1;

    await trackWrite(update(ref(db), updates));
    logChange('日次の締め', `${festival.year}年 ${festival.day}日目`,
      `退室済み${allRecords.length}件 / ゴミ箱${trashRecords.length}件`);
    closeMsg(`${key} を保存しました。次の患者IDは ${festival.year}-${festival.day + 1}-001 からです。`, 'ok');
  } catch (e) {
    console.warn('closeDay:', e);
    closeMsg('締められませんでした: ' + (e.code || e.message), 'err');
  } finally {
    btn.disabled = false;
  }
}

async function saveFestival() {
  const y = Number($c('fest-year').value);
  const d = Number($c('fest-day').value);
  if (!Number.isInteger(y) || y < 2000 || y > 2100) { closeMsg('開催年が正しくありません。', 'err'); return; }
  if (!Number.isInteger(d) || d < 1 || d > 10)      { closeMsg('開催日が正しくありません。', 'err'); return; }
  try {
    await trackWrite(update(ref(db, 'kyuugo/festival'), {year: y, day: d}));
    logChange('開催年・日の変更', `${y}年 ${d}日目`, '');
    $c('fest-form').style.display = 'none';
    closeMsg(`開催年・日を ${y}年 ${d}日目 に変更しました。`, 'ok');
  } catch (e) {
    closeMsg('変更できませんでした: ' + (e.code || e.message), 'err');
  }
}

function setupCloseSection() {
  if (!me.admin) return;              // 締めは管理者のみ
  $c('close-section').style.display = '';

  // 採番の現在位置を見て、次に発行されるIDを出す
  onValue(ref(db, 'kyuugo/globalPatientId'), snap => {
    nextSeq = (Number(snap.val()) || 0) + 1;
    renderFestival();
  }, e => console.warn('globalPatientId:', e));

  $c('btn-close-day').addEventListener('click', closeDay);
  $c('fest-edit').addEventListener('click', () => {
    $c('fest-year').value = festival.year;
    $c('fest-day').value  = festival.day;
    $c('fest-form').style.display = '';
  });
  $c('fest-cancel').addEventListener('click', () => { $c('fest-form').style.display = 'none'; });
  $c('fest-save').addEventListener('click', saveFestival);
}

// ─── 起動（認証が通ってから） ─────────────────────────
requireAuth('📋 退室済み一覧', () => {
  subscribeFestival(renderFestival);
  setupCloseSection();
  subscribeAll();
});
</script>
</body>
</html>
