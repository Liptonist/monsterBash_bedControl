<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>退室済み一覧 | 救護所</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;color:#1a1a1a;font-size:14px;background:#f5f5f5}
.hdr{background:#fff;border-bottom:1px solid #e0e0e0;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.hdr-title{font-size:15px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back-link{font-size:12px;color:#3b82f6;text-decoration:none;padding:5px 10px;border:1px solid #93c5fd;border-radius:6px;background:#eff6ff}
.back-link:hover{background:#dbeafe}
.dot{width:8px;height:8px;border-radius:50%;background:#9e9e9e;flex-shrink:0;transition:background .3s}
.dot.online{background:#22c55e;animation:blink 2s infinite}
.dot.offline{background:#ef4444}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.sync-label{font-size:11px;color:#888}
.content{padding:14px}
.summary{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.sum-card{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:10px 16px;text-align:center;min-width:80px}
.sum-num{font-size:22px;font-weight:600;color:#3b82f6}
.sum-lbl{font-size:11px;color:#888;margin-top:2px}
.filter-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.filter-label{font-size:12px;color:#666}
.filter-select{font-size:12px;padding:5px 8px;border:1px solid #ccc;border-radius:6px;background:#fff;color:#1a1a1a}
.filter-input{font-size:12px;padding:5px 8px;border:1px solid #ccc;border-radius:6px;background:#fff;color:#1a1a1a;font-family:inherit;width:190px;max-width:45vw}
.filter-input:focus{outline:none;border-color:#3b82f6}
.filter-count{font-size:11.5px;color:#888;white-space:nowrap}
/* 検索欄に使えない文字（漢字）が入っているときの警告 */
.filter-input.bad{border-color:#f5c6c2;background:#fff7f6}
.name-err{display:none;margin:0 0 10px;background:#fdecea;border:1px solid #f5c6c2;border-radius:8px;
  padding:8px 10px;font-size:11.5px;line-height:1.7;color:#b3261e}
.name-err.show{display:block}
.empty-msg{text-align:center;color:#aaa;padding:40px;font-size:13px}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
table{width:100%;min-width:760px;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden}
thead{background:#f0f4ff}
th{font-size:11px;font-weight:600;color:#555;padding:9px 10px;text-align:left;border-bottom:1px solid #e0e0e0;white-space:nowrap}
/* 並べ替えできる見出し。押せることが分かるように矢印を常に出す */
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{background:#e4ecff}
th.sorted{color:#1e40af}
.sort-ar{font-size:9px;margin-left:3px;color:#b8c0cc}
th.sorted .sort-ar{color:#3b82f6}
/* 氏名や種別が「佐藤太／郎」「ベッ／ド」と折り返さないよう、既定は折り返さない。
   はみ出す分は表ごと横スクロールする（.table-scroll） */
td{font-size:12px;padding:9px 10px;border-bottom:1px solid #f0f0f0;vertical-align:middle;white-space:nowrap}
/* 症状だけは長くなるので折り返す */
td.sym-cell{white-space:normal;min-width:110px;max-width:220px}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
.pid{font-size:10px;padding:2px 6px;border-radius:4px;background:#f0fdf4;border:1px solid #86efac;color:#166534;font-weight:500}
.room-badge{font-size:10px;padding:2px 6px;border-radius:4px;background:#eff6ff;border:1px solid #93c5fd;color:#1e40af;font-weight:500}
.slot-badge{font-size:10px;padding:2px 6px;border-radius:4px;background:#f5f5f5;border:1px solid #ccc;color:#555;font-weight:500}
/* 重症度。配色はメイン画面（index.html の .st-g/.st-y/.st-r）に合わせる */
.tri{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;white-space:nowrap}
.tri-green{background:#dcfce7;border:1px solid #86efac;color:#166534}
.tri-yellow{background:#fef9c3;border:1px solid #fde047;color:#92400e}
.tri-red{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b}
/* 転帰。救急搬送だけは見落とさないよう強めの色にする */
.out{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;white-space:nowrap}
.out-ok{background:#f1f5f9;border:1px solid #cbd5e1;color:#475569}
.out-amb{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b}
.out-obs{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.csv-btn{margin-left:auto;background:#fff;border:1px solid #86efac;color:#166534;border-radius:6px;padding:5px 12px;font-size:12px;font-family:inherit;cursor:pointer;white-space:nowrap}
.csv-btn:hover{background:#f0fdf4}
.csv-btn:disabled{border-color:#e5e7eb;color:#9ca3af;cursor:not-allowed;background:#fff}
.stay{font-weight:500;color:#374151}
.stay.long{color:#dc2626}
.del-btn{background:none;border:1px solid #fca5a5;border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer;color:#dc2626;line-height:1}
.del-btn:hover{background:#fee2e2}
.restore-btn{background:none;border:1px solid #93c5fd;border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer;color:#1e40af;white-space:nowrap}
.restore-btn:hover{background:#eff6ff}
/* 操作欄：入室に戻す（緑の塗り）と ゴミ箱（赤の枠線）を見た目で区別する */
.act-cell{display:flex;align-items:center;gap:10px;white-space:nowrap}
.reenter-btn{background:#16a34a;border:1px solid #15803d;border-radius:6px;padding:5px 10px;font-size:11.5px;font-weight:600;cursor:pointer;color:#fff;white-space:nowrap}
.reenter-btn:hover{background:#15803d}
.act-sep{width:1px;height:18px;background:#e0e0e0;flex-shrink:0}
/* 入室に戻すモーダル */
.ovl{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:flex-start;justify-content:center;padding:20px 12px;overflow-y:auto}
.ovl.show{display:flex}
.mdl{background:#fff;border-radius:14px;border:1px solid #e0e0e0;width:360px;max-width:100%;margin:auto;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.mh{padding:14px 16px;border-bottom:1px solid #e0e0e0;display:flex;justify-content:space-between;align-items:center}
.mht{font-size:15px;font-weight:600}
.xbtn{background:none;border:none;cursor:pointer;color:#888;font-size:18px;line-height:1;padding:2px}
.mb{padding:14px 16px;display:flex;flex-direction:column;gap:11px}
.mf{padding:12px 16px;border-top:1px solid #e0e0e0;display:flex;gap:8px;justify-content:flex-end}
.lbl{font-size:11px;color:#666;margin-bottom:4px;font-weight:500}
.finput{width:100%;font-size:13px;padding:8px 10px;border-radius:6px;border:1px solid #ccc;background:#fafafa;color:#1a1a1a}
.finput:focus{outline:none;border-color:#3b82f6;background:#fff}
.finput:disabled{background:#f0f0f0;color:#888}
.re-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.re-sum{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:9px 11px;font-size:12.5px;line-height:1.8;color:#166534}
.re-note{font-size:11.5px;color:#777;line-height:1.7}
.re-orig{font-size:11.5px;line-height:1.7;color:#1e40af}
.re-orig.busy{color:#b45309}
.canbtn{background:none;border:1px solid #ccc;border-radius:6px;padding:9px 16px;font-size:13px;cursor:pointer;color:#555}
.canbtn:hover{background:#f0f0f0}
.re-go{background:#16a34a;color:#fff;border:none;border-radius:6px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer}
.re-go:hover{background:#15803d}
.re-go:disabled{background:#e5e7eb;color:#9ca3af;cursor:not-allowed}
.trash-section{margin-top:24px}
.trash-heading{font-size:13px;font-weight:600;color:#888;margin-bottom:8px;padding-top:14px;border-top:1px solid #e0e0e0}
.trash-wrap{opacity:.7}
.close-section{margin-top:28px;padding-top:16px;border-top:1px solid #e0e0e0}
.close-h{font-size:13px;font-weight:600;color:#888;margin-bottom:10px}
.close-body{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:14px}
.close-now{font-size:13px;margin-bottom:10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.mono{font-family:monospace;background:#f1f3f4;border-radius:4px;padding:1px 6px;font-size:12px}
.link-btn{background:none;border:none;color:#3b82f6;font-size:11.5px;cursor:pointer;text-decoration:underline;padding:0}
.fest-issued{font-size:11.5px;color:#888}
.fest-form{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;font-size:12.5px;color:#555}
.fest-form input{width:80px;padding:5px 8px;border:1px solid #ccc;border-radius:6px;font-size:13px;font-family:inherit;margin-left:4px}
.btn-sm{background:none;border:1px solid #d0d0d0;color:#555;padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer}
.btn-sm:hover{background:#f5f5f5}
.close-desc{font-size:12px;color:#777;line-height:1.8;margin-bottom:12px}
.btn-close{background:#d97706;border:none;color:#fff;font-size:13px;font-weight:600;padding:10px 20px;border-radius:8px;cursor:pointer}
.btn-close:hover{background:#b45309}
.btn-close:disabled{opacity:.5;cursor:default}
.msg{border-radius:8px;padding:9px 12px;font-size:12.5px;line-height:1.7;margin-bottom:12px;display:none;word-break:break-all}
.msg.err{background:#fdecea;border:1px solid #f5c6c2;color:#b3261e;display:block}
.msg.ok{background:#e8f5e9;border:1px solid #b7e0ba;color:#256029;display:block}
.offline-banner{display:none;background:#fef3c7;border-bottom:1px solid #fcd34d;padding:6px 14px;font-size:12px;color:#92400e;text-align:center}
.offline-banner.show{display:block}
</style>
</head>
<body>

<div class="offline-banner" id="offline-banner">⚠️ オフライン中 — 回線復帰時に最新データが表示されます</div>

<div class="hdr">
  <a class="back-link" href="index.html">← 戻る</a>
  <span class="hdr-title">📋 退室済み一覧</span>
  <span class="hdr-user" id="hdr-user"></span>
  <button class="hdr-logout" id="hdr-logout" style="display:none">ログアウト</button>
  <div class="dot" id="sync-dot"></div>
  <span class="sync-label" id="sync-label">接続中...</span>
</div>

<div class="content">
  <div class="summary" id="summary"></div>
  <div class="filter-row">
    <span class="filter-label">絞り込み：</span>
    <select class="filter-select" id="filter-room" onchange="applyFilter()">
      <option value="">全部屋</option>
      <option>本部</option>
      <option>空海横</option>
      <option>サーカス</option>
      <option>茶堂</option>
    </select>
    <select class="filter-select" id="filter-kind" onchange="applyFilter()">
      <option value="">全種別</option>
      <option value="ベッド">ベッド</option>
      <option value="室内椅子">室内椅子</option>
      <option value="室外椅子">室外椅子</option>
    </select>
    <select class="filter-select" id="filter-outcome" onchange="applyFilter()">
      <option value="">全転帰</option>
    </select>
    <input class="filter-input" id="filter-name" type="search" placeholder="氏名で検索（部分一致）"
           title="ひらがなはカタカナにそろえます。姓と名の間の空白や全角・半角の違いは無視して探します（漢字では探せません）"
           oninput="applyFilter()" onchange="onFilterNameChange()">
    <span class="filter-count" id="filter-count"></span>
    <button class="csv-btn" id="csv-btn" onclick="exportCSV()" title="絞り込んだ結果をCSVで保存します" style="display:none">⬇️ CSVで保存</button>
  </div>
  <div class="name-err" id="filter-name-err"></div>
  <div id="table-area"></div>

  <div class="trash-section">
    <div class="trash-heading">🗑️ ゴミ箱（<span id="trash-count">0</span>件）</div>
    <div class="trash-wrap" id="trash-area"></div>
  </div>

  <!-- 日次の締め（管理者のみ） -->
  <div class="close-section" id="close-section" style="display:none">
    <div class="close-h">📦 日次の締め</div>
    <div class="close-body">
      <div class="close-now">
        現在の開催日：<b id="fest-now">—</b>
        　次に発行：<span id="fest-sample" class="mono">—</span>
        <span class="fest-issued">本日 <b id="fest-issued">0</b> 件発行済み</span>
        <button class="link-btn" id="fest-edit">開催年・日を修正</button>
      </div>
      <div class="fest-form" id="fest-form" style="display:none">
        <label>開催年 <input type="number" id="fest-year" min="2000" max="2100" step="1"></label>
        <label>開催日 <input type="number" id="fest-day" min="1" max="10" step="1"></label>
        <button class="btn-sm" id="fest-save">保存</button>
        <button class="btn-sm" id="fest-cancel">やめる</button>
      </div>
      <div class="close-desc">
        その日の <b>退室済み一覧</b> と <b>ゴミ箱</b> をまとめて保存し、この画面から消します。
        患者IDの連番は1に戻り、開催日が1つ進みます（翌日は <span class="mono" id="fest-next">—</span> から）。
        保存した内容は「保存済みの記録」ページでいつでも見られます。
      </div>
      <div class="msg" id="close-msg"></div>
      <button class="btn-close" id="btn-close-day">この日を締める</button>
    </div>
  </div>
</div>

<!-- 入室に戻すモーダル（誤って退室にした患者を戻す） -->
<div class="ovl" id="re-ovl">
  <div class="mdl">
    <div class="mh">
      <span class="mht">🛏️ 入室に戻す</span>
      <button class="xbtn" onclick="closeReenter()">✕</button>
    </div>
    <div class="mb">
      <div class="re-sum" id="re-sum"></div>
      <div class="re-note">誤って退室にした患者を、もう一度ベッド・椅子に入れます。退室記録は一覧から消え、ゴミ箱へ移ります。</div>
      <div class="re-grid">
        <div>
          <div class="lbl">戻す部屋</div>
          <select class="finput" id="re-room" onchange="onReenterPlaceChange()"></select>
        </div>
        <div>
          <div class="lbl">種別</div>
          <select class="finput" id="re-kind" onchange="onReenterPlaceChange()">
            <option value="bed">ベッド</option>
            <option value="chairIn">室内椅子</option>
            <option value="chairOut">室外椅子</option>
          </select>
        </div>
      </div>
      <div>
        <div class="lbl">戻す場所（空いている番号）</div>
        <select class="finput" id="re-slot"></select>
      </div>
      <div class="re-orig" id="re-orig"></div>
      <div class="msg" id="re-msg"></div>
    </div>
    <div class="mf">
      <button class="canbtn" onclick="closeReenter()">キャンセル</button>
      <button class="re-go" id="re-go" onclick="doReenter()">この場所へ戻す</button>
    </div>
  </div>
</div>

<script type="module">
import { ref, onValue, set, remove, update, get, runTransaction }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { db, me, requireAuth, logChange, trackWrite,
         festival, subscribeFestival, pidShort, ROOMS,
         OUTCOMES, OUTCOME_CLASS, CSV_HEADERS, csvRow, toCSV, downloadCSV,
         safeFileName, nameMatches, sortRecords, nextSort, sortTh,
         fixName, hasKanji } from './app-common.js?v=1.0.1';

// ─── 定数（index.html と揃える） ─────────────────────
const KIND_PREFIX = {bed:'B', chairIn:'CI', chairOut:'CO'};
const KIND_LABEL  = {bed:'ベッド', chairIn:'室内椅子', chairOut:'室外椅子'};
const KIND_MAP    = {bed:'beds', chairIn:'chairsIn', chairOut:'chairsOut'};
// 退室記録の種別・トリアージは日本語で入っているので、枠の値に戻す
const LABEL_KIND    = {'ベッド':'bed', '室内椅子':'chairIn', '室外椅子':'chairOut'};
const TRIAGE_STATUS = {'軽症':'green', '中等症':'yellow', '重症':'red'};
// 旧ステータス互換（Firebase上に旧データが残っている場合）
const LEGACY = {used:'yellow', overtime:'red', waiting:'yellow'};

let allRecords = [];

function tsToHHMM(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
}

let trashRecords = [];
// 入室に戻す先を選ぶために、ベッド・椅子の空き状況も見ておく
let rooms = ROOMS.map(() => ({beds:[], chairsIn:[], chairsOut:[]}));

const asArray = v => Array.isArray(v) ? v : Object.values(v || {});
function normStatus(s) {
  if (!s) return 'empty';
  return LEGACY[s] || s;
}
// kyuugo/rooms は配列でもオブジェクトでも来るので、扱いやすい形に均す
function readRooms(val) {
  const src = asArray(val);
  return ROOMS.map((_, ri) => {
    const room = src[ri] || {};
    const out = {};
    Object.values(KIND_MAP).forEach(key => {
      out[key] = asArray(room[key]).map((it, i) => ({
        localId: i + 1,
        status: normStatus(it && it.status),
      }));
    });
    return out;
  });
}

// 認証が通ってから購読を開始する（startApp から呼ばれる）
function subscribeAll() {
  onValue(ref(db, '.info/connected'), snap => {
    const online = snap.val() === true;
    document.getElementById('sync-dot').className = 'dot ' + (online ? 'online' : 'offline');
    document.getElementById('sync-label').textContent = online ? 'リアルタイム同期中' : 'オフライン';
    document.getElementById('offline-banner').classList.toggle('show', !online);
  });

  onValue(ref(db, 'kyuugo/discharged'), snap => {
    const data = snap.val();
    if (!data) { allRecords = []; applyFilter(); return; }
    // Firebaseのpushキーでソート（新しい順）
    allRecords = Object.entries(data)
      .map(([k, v]) => ({...v, _key: k}))
      .sort((a,b) => (b.recordedAt||0) - (a.recordedAt||0));
    applyFilter();
  });

  onValue(ref(db, 'kyuugo/discharged_trash'), snap => {
    const data = snap.val();
    trashRecords = data
      ? Object.entries(data).map(([k, v]) => ({...v, _key: k})).sort((a,b) => (b.trashedAt||0) - (a.trashedAt||0))
      : [];
    renderTrash();
  });

  onValue(ref(db, 'kyuugo/rooms'), snap => {
    rooms = readRooms(snap.val());
    // モーダルを開いている間に他の人が埋めた・空けた場合に追従する
    if (reenterKey) { refreshSlotOptions(); renderOrigHint(); }
  }, e => console.warn('rooms:', e));
}

// 絞り込んだ結果はCSV書き出しでも使うので保持しておく
let shownRecords = [];

// 並べ替えの状態。key が null のときは既定（退室が新しい順）。
// 一覧とゴミ箱は別々に持つ（片方を並べ替えても、もう片方は動かさない）
let listSort  = {key: null, dir: null};
let trashSort = {key: null, dir: null};

function setListSort(key)  { listSort  = nextSort(listSort, key);  applyFilter(); }
function setTrashSort(key) { trashSort = nextSort(trashSort, key); renderTrash(); }
window.setListSort  = setListSort;
window.setTrashSort = setTrashSort;

// 氏名の検索欄はカタカナで入れてもらう（記録もカタカナでそろえているため）。
// 入力中に直すと日本語入力の変換を邪魔するので、欄から離れたときだけ直す。
function onFilterNameChange() {
  const el = document.getElementById('filter-name');
  const v = fixName(el.value);
  if (el.value !== v) { el.value = v; applyFilter(); }
}
window.onFilterNameChange = onFilterNameChange;

const KANJI_MSG = '漢字では探せません。カタカナで入力してください（例：ヤマダ）。';

function applyFilter() {
  const room = document.getElementById('filter-room').value;
  const kind = document.getElementById('filter-kind').value;
  const out  = document.getElementById('filter-outcome').value;
  const nameEl = document.getElementById('filter-name');
  // 漢字が入っている間は氏名での絞り込みを見送る。打った文字は消さずに残し、
  // 部屋・種別・転帰の絞り込みはそのまま効かせる
  const bad = hasKanji(nameEl.value);
  const err = document.getElementById('filter-name-err');
  nameEl.classList.toggle('bad', bad);
  err.classList.toggle('show', bad);
  err.textContent = bad ? KANJI_MSG : '';
  const name = bad ? '' : nameEl.value;
  const hits = allRecords.filter(r =>
    (!room || r.room === room) &&
    (!kind || r.kind === kind) &&
    (!out  || (r.outcome || '') === out) &&
    nameMatches(r.name, name)
  );
  shownRecords = sortRecords(hits, listSort.key, listSort.dir);
  document.getElementById('filter-count').textContent =
    hits.length === allRecords.length ? '' : `該当 ${hits.length}件 / 全 ${allRecords.length}件`;
  render(shownRecords);
}
window.applyFilter = applyFilter;

// ─── CSV書き出し ─────────────────────────────────────
// 絞り込んだ結果をそのまま出す。撤収後の報告と、記録の集計に使う。
// 患者記録の持ち出しになるため管理者だけ（ボタン自体を出していない）
function exportCSV() {
  if (!me.admin) return;
  if (!shownRecords.length) { alert('書き出せる記録がありません。'); return; }
  const csv = toCSV(CSV_HEADERS, shownRecords.map(csvRow));
  const name = safeFileName(`退室済み_${festival.year}年${festival.day}日目_${stamp()}.csv`);
  downloadCSV(name, csv);
  logChange('CSV書き出し', '退室済み一覧', `${shownRecords.length}件`);
}
window.exportCSV = exportCSV;

function stamp() {
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}

function render(records) {
  // サマリー
  document.getElementById('summary').innerHTML = `
    <div class="sum-card"><div class="sum-num">${allRecords.length}</div><div class="sum-lbl">総退室数</div></div>
    <div class="sum-card"><div class="sum-num">${avgStay(allRecords)}</div><div class="sum-lbl">平均滞在(分)</div></div>
    <div class="sum-card"><div class="sum-num">${countOutcome(allRecords,'救急搬送')}</div><div class="sum-lbl">救急搬送</div></div>
    <div class="sum-card"><div class="sum-num">${countRoom(allRecords,'本部')}</div><div class="sum-lbl">本部</div></div>
    <div class="sum-card"><div class="sum-num">${countRoom(allRecords,'空海横')}</div><div class="sum-lbl">空海横</div></div>
    <div class="sum-card"><div class="sum-num">${countRoom(allRecords,'サーカス')}</div><div class="sum-lbl">サーカス</div></div>
    <div class="sum-card"><div class="sum-num">${countRoom(allRecords,'茶堂')}</div><div class="sum-lbl">茶堂</div></div>
  `;

  document.getElementById('table-area').innerHTML =
    records.length === 0
      ? `<div class="empty-msg">${allRecords.length ? '該当する記録はありません' : '退室済みの記録はまだありません'}</div>`
      : tableHTML(records, 'trash', listSort, 'setListSort');
}

function renderTrash() {
  document.getElementById('trash-count').textContent = trashRecords.length;
  document.getElementById('trash-area').innerHTML =
    trashRecords.length === 0
      ? `<div class="empty-msg">ゴミ箱は空です</div>`
      : tableHTML(sortRecords(trashRecords, trashSort.key, trashSort.dir), 'restore', trashSort, 'setTrashSort');
}

// 患者名や症状はスタッフが入力した文字列なので、そのままHTMLに入れない
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

// 重症度。TRIAGE_STATUS が軽症→green・中等症→yellow・重症→red を持つ。
// 記録が無い古いデータは「—」、想定外の値はそのまま文字で出す
function triageHTML(r) {
  const t = (r.triage || '').trim();
  if (!t) return '—';
  const cls = TRIAGE_STATUS[t];
  return cls ? `<span class="tri tri-${cls}">${esc(t)}</span>` : esc(t);
}

// 転帰。転帰を入れる前に記録された古いデータは「—」になる
function outcomeHTML(r) {
  const o = (r.outcome || '').trim();
  if (!o) return '—';
  const cls = OUTCOME_CLASS[o];
  return cls ? `<span class="out out-${cls}">${esc(o)}</span>` : esc(o);
}

// 年齢。入っていない記録は「—」
function ageText(r) {
  return r.age != null && r.age !== '' ? esc(r.age) + '歳' : '—';
}

function recordRowHTML(r, action) {
  const stay = r.stayMins != null ? r.stayMins : '—';
  const stayClass = r.stayMins >= 30 ? 'stay long' : 'stay';
  let actionCell = '';
  if (action === 'trash') actionCell = `<td><div class="act-cell">
      <button class="reenter-btn" onclick="openReenter('${r._key}')" title="ベッド・椅子に戻す（誤って退室にした場合）">🛏️ 入室に戻す</button>
      <span class="act-sep"></span>
      <button class="del-btn" onclick="moveToTrash('${r._key}')" title="ゴミ箱に移動">🗑️</button>
    </div></td>`;
  else if (action === 'restore') actionCell = `<td><button class="restore-btn" onclick="restoreFromTrash('${r._key}')" title="退室済み一覧に戻す">↩️ 一覧に戻す</button></td>`;
  return `<tr>
    <td>${pidShort(r) ? `<span class="pid">${esc(pidShort(r))}</span>` : '—'}</td>
    <td>${esc(r.name || '—')}</td>
    <td>${ageText(r)}</td>
    <td class="sym-cell">${esc(r.sym || '—')}</td>
    <td><span class="room-badge">${esc(r.room||'—')}</span></td>
    <td><span class="slot-badge">${esc(r.slotId||'—')}</span></td>
    <td>${esc(r.kind||'—')}</td>
    <td>${triageHTML(r)}</td>
    <td>${outcomeHTML(r)}</td>
    <td>${tsToHHMM(r.enteredAt)}</td>
    <td>${tsToHHMM(r.exitedAt)}</td>
    <td class="${stayClass}">${stay !== '—' ? stay+'分' : '—'}</td>
    ${actionCell}
  </tr>`;
}

// 見出しを押すと並べ替える。sort は今の状態、handler は window に公開した関数名
function tableHTML(records, action, sort, handler) {
  const rows = records.map(r => recordRowHTML(r, action)).join('');
  const th = (label, key) => sortTh(label, key, sort, handler);
  return `
    <div class="table-scroll">
    <table>
      <thead>
        <tr>
          ${th('患者ID', 'pid')}
          ${th('患者名', 'name')}
          ${th('年齢', 'age')}
          ${th('症状', 'sym')}
          ${th('部屋', 'room')}
          ${th('席ID', 'slot')}
          ${th('種別', 'kind')}
          ${th('重症度', 'triage')}
          ${th('転帰', 'outcome')}
          ${th('入室', 'enteredAt')}
          ${th('退室', 'exitedAt')}
          ${th('滞在時間', 'stayMins')}
          ${action ? '<th>操作</th>' : ''}
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    </div>`;
}

function moveToTrash(key) {
  if (!confirm('この記録をゴミ箱に移動しますか？')) return;
  const rec = allRecords.find(r => r._key === key);
  if (!rec) return;
  const { _key, ...data } = rec;
  trackWrite(
    set(ref(db, 'kyuugo/discharged_trash/' + key), { ...data, trashedAt: Date.now() })
      .then(() => {
        logChange('ゴミ箱へ移動', recLabel(rec), recDetail(rec));
        return remove(ref(db, 'kyuugo/discharged/' + key));
      })
  ).catch(() => {});
}
window.moveToTrash = moveToTrash;

function restoreFromTrash(key) {
  if (!confirm('この記録を一覧に戻しますか？')) return;
  const rec = trashRecords.find(r => r._key === key);
  if (!rec) return;
  const { _key, trashedAt, reenteredTo, ...data } = rec;
  trackWrite(
    set(ref(db, 'kyuugo/discharged/' + key), data)
      .then(() => {
        logChange('一覧に戻す', recLabel(rec), recDetail(rec));
        return remove(ref(db, 'kyuugo/discharged_trash/' + key));
      })
  ).catch(() => {});
}

// 変更履歴用に退室記録を要約する
function recLabel(r) {
  return [r.room, r.kind && r.slotId ? r.kind + r.slotId : r.slotId].filter(Boolean).join(' ') || '退室記録';
}
function recDetail(r) {
  return [
    pidShort(r) || null,
    r.name || null,
    r.triage || null,
    r.outcome || null,
    r.stayMins != null ? `滞在${r.stayMins}分` : null,
  ].filter(Boolean).join(' / ');
}
window.restoreFromTrash = restoreFromTrash;

// ─── 入室に戻す（誤って退室にした患者を戻す） ──────────
// ゴミ箱ボタンとは別物。こちらは患者をもう一度ベッド・椅子に入れる。
let reenterKey = null;

const $r = id => document.getElementById(id);

// 記録の席ID（例 B3・CI2）から部屋内の並び順（0始まり）を出す
function slotIndexOf(rec) {
  const n = Number(String(rec.slotId || '').replace(/^\D+/, ''));
  return Number.isInteger(n) && n > 0 ? n - 1 : null;
}
function origPlaceOf(rec) {
  const roomIdx = ROOMS.indexOf(rec.room);
  const kind = LABEL_KIND[rec.kind];
  const idx = slotIndexOf(rec);
  if (roomIdx < 0 || !kind || idx === null) return null;
  return {roomIdx, kind, idx};
}
function placeLabel(roomIdx, kind, idx) {
  return `${ROOMS[roomIdx]} ${KIND_LABEL[kind]}${KIND_PREFIX[kind]}${idx + 1}`;
}
function slotAt(roomIdx, kind, idx) {
  const arr = rooms[roomIdx] && rooms[roomIdx][KIND_MAP[kind]];
  return arr ? arr[idx] : undefined;
}
function isFree(roomIdx, kind, idx) {
  const it = slotAt(roomIdx, kind, idx);
  return !!it && it.status === 'empty';
}

function reMsg(text, kind) {
  const el = $r('re-msg');
  el.className = 'msg' + (kind ? ' ' + kind : '');
  el.textContent = text || '';
}

// 選んだ部屋・種別の空き番号を並べ直す。
// preferIdx を省くと今の選択を保つ（他の人の操作で一覧が変わったとき用）。
// null を渡すと先頭の空きに戻す。
function refreshSlotOptions(preferIdx) {
  const roomIdx = Number($r('re-room').value) || 0;
  const kind = $r('re-kind').value;
  const arr = (rooms[roomIdx] && rooms[roomIdx][KIND_MAP[kind]]) || [];
  const sel = $r('re-slot'), btn = $r('re-go');
  const want = preferIdx !== undefined ? preferIdx
             : (sel.value !== '' ? Number(sel.value) : null);
  const empties = arr.map((it, i) => ({it, i})).filter(({it}) => it.status === 'empty');
  if (empties.length === 0) {
    sel.innerHTML = `<option value="">空きなし</option>`;
    sel.disabled = true;
    btn.disabled = true;
    return;
  }
  sel.disabled = false;
  btn.disabled = false;
  sel.innerHTML = empties
    .map(({it, i}) => `<option value="${i}">${KIND_PREFIX[kind]}${it.localId}</option>`).join('');
  if (want != null && empties.some(e => e.i === want)) sel.value = String(want);
}

// 元いた場所の案内。空いていれば初期選択、埋まっていればその旨を出す
function renderOrigHint() {
  const rec = allRecords.find(r => r._key === reenterKey);
  const el = $r('re-orig');
  if (!rec) { el.textContent = ''; return; }
  const orig = origPlaceOf(rec);
  if (!orig) {
    el.className = 're-orig busy';
    el.textContent = '元の場所が記録から分かりませんでした。戻す場所を選んでください。';
    return;
  }
  const label = placeLabel(orig.roomIdx, orig.kind, orig.idx);
  if (isFree(orig.roomIdx, orig.kind, orig.idx)) {
    el.className = 're-orig';
    el.textContent = `元の場所：${label}（初期選択）`;
  } else {
    el.className = 're-orig busy';
    el.textContent = `元の場所（${label}）は今ふさがっています。別の空きを選んでください。`;
  }
}

function onReenterPlaceChange() { refreshSlotOptions(null); }
window.onReenterPlaceChange = onReenterPlaceChange;

function openReenter(key) {
  const rec = allRecords.find(r => r._key === key);
  if (!rec) return;
  reenterKey = key;
  reMsg('');

  $r('re-sum').innerHTML = [
    pidShort(rec) ? `<b>${esc(pidShort(rec))}</b>` : '',
    esc(rec.name || '氏名未入力'),
    rec.sym ? esc(rec.sym) : '',
    `${tsToHHMM(rec.enteredAt)} 入室 → ${tsToHHMM(rec.exitedAt)} 退室`,
  ].filter(Boolean).join(' ／ ');

  $r('re-room').innerHTML =
    ROOMS.map((n, i) => `<option value="${i}">${n}</option>`).join('');

  // 初期値は元いた場所。分からなければ先頭の部屋・ベッドから探す
  const orig = origPlaceOf(rec);
  $r('re-room').value = String(orig ? orig.roomIdx : 0);
  $r('re-kind').value = orig ? orig.kind : 'bed';
  refreshSlotOptions(orig ? orig.idx : null);
  renderOrigHint();

  $r('re-ovl').classList.add('show');
}
window.openReenter = openReenter;

function closeReenter() {
  $r('re-ovl').classList.remove('show');
  reenterKey = null;
  reMsg('');
}
window.closeReenter = closeReenter;

// 戻す枠に書き込む中身。index.html の itemPayload と同じ形にする
function slotPayload(rec, idx) {
  return {
    localId:     idx + 1,
    patientId:   rec.patientId ?? null,
    patientCode: rec.patientCode ?? null,
    status:      TRIAGE_STATUS[rec.triage] || 'green',
    name:        rec.name || '',
    sym:         rec.sym || '',
    waiting:     false,
    companion:   false,
    enteredAt:   rec.enteredAt ?? null,
    age:         rec.age ?? null,
    gender:      rec.gender || '',
  };
}

async function doReenter() {
  const rec = allRecords.find(r => r._key === reenterKey);
  if (!rec) { closeReenter(); return; }
  const roomIdx = Number($r('re-room').value) || 0;
  const kind = $r('re-kind').value;
  const idxStr = $r('re-slot').value;
  if (idxStr === '') { reMsg('戻せる空きがありません。別の部屋・種別を選んでください。', 'err'); return; }
  const idx = Number(idxStr);
  const label = placeLabel(roomIdx, kind, idx);
  const who = [pidShort(rec), rec.name || '氏名未入力'].filter(Boolean).join(' ');

  if (!confirm(`${who} さんを ${label} に戻しますか？\n\n`
             + `退室済み一覧からは消え、退室記録はゴミ箱へ移ります。`)) return;

  const btn = $r('re-go');
  btn.disabled = true;
  reMsg('');
  try {
    // 空き確認と書き込みを一度に行い、他の人と同じ枠を取り合わないようにする
    const res = await trackWrite(runTransaction(
      ref(db, `kyuugo/rooms/${roomIdx}/${KIND_MAP[kind]}/${idx}`),
      cur => {
        if (cur && normStatus(cur.status) !== 'empty') return;   // 使用中なら中止
        return slotPayload(rec, idx);
      }
    ));
    if (!res.committed) {
      reMsg(`${label} は直前に使われました。別の空きを選び直してください。`, 'err');
      refreshSlotOptions(null);
      renderOrigHint();
      return;
    }

    // 退室記録はゴミ箱経由で片付ける（先にゴミ箱へ写さないと削除できない）
    const { _key, ...data } = rec;
    await trackWrite(set(ref(db, 'kyuugo/discharged_trash/' + _key),
      {...data, trashedAt: Date.now(), reenteredTo: label}));
    await trackWrite(remove(ref(db, 'kyuugo/discharged/' + _key)));

    logChange('入室に戻す', label, recDetail(rec));
    closeReenter();
  } catch (e) {
    console.warn('reenter:', e);
    reMsg('戻せませんでした: ' + (e.code || e.message || e), 'err');
  } finally {
    btn.disabled = false;
  }
}
window.doReenter = doReenter;

function avgStay(records) {
  const valid = records.filter(r => r.stayMins != null);
  if (!valid.length) return '—';
  return Math.round(valid.reduce((s,r) => s+r.stayMins, 0) / valid.length);
}
function countRoom(records, room) {
  return records.filter(r => r.room === room).length;
}
function countOutcome(records, outcome) {
  return records.filter(r => (r.outcome || '') === outcome).length;
}

// ─── 日次の締め（管理者のみ） ────────────────────────
const $c = id => document.getElementById(id);

// 次に発行される連番。kyuugo/globalPatientId は「最後に発行した番号」
let nextSeq = 1;

function renderFestival() {
  // 画面には年を省いた形で出す（保存されるIDには年が入る）
  $c('fest-now').textContent = `${festival.year}年 ${festival.day}日目`;
  $c('fest-sample').textContent = `${festival.day}-${String(nextSeq).padStart(3, '0')}`;
  $c('fest-issued').textContent = String(nextSeq - 1);
  $c('fest-next').textContent   = `${festival.day + 1}-001`;
}

function closeMsg(text, kind) {
  const el = $c('close-msg');
  el.className = 'msg ' + kind;
  el.textContent = text;
}

// 入室中（空きでない）の枠数を数える
function countOccupied(roomsVal) {
  let n = 0;
  asArray(roomsVal).forEach(room => {
    ['beds', 'chairsIn', 'chairsOut'].forEach(k => {
      asArray(room && room[k]).forEach(it => {
        if (it && it.status && it.status !== 'empty') n++;
      });
    });
  });
  return n;
}

async function closeDay() {
  $c('close-msg').className = 'msg';
  const key = `${festival.year}-${festival.day}`;

  let existing, roomsVal;
  try {
    [existing, roomsVal] = await Promise.all([
      get(ref(db, 'kyuugo/archives/' + key)),
      get(ref(db, 'kyuugo/rooms')),
    ]);
  } catch (e) {
    closeMsg('確認できませんでした: ' + (e.code || e.message), 'err'); return;
  }

  if (existing.exists()) {
    closeMsg(`${key} はすでに保存済みです。開催年・日を修正してからやり直してください。`, 'err');
    return;
  }

  const occupied = countOccupied(roomsVal.val());
  const lines = [
    `${festival.year}年 ${festival.day}日目 を締めます。`,
    '',
    `退室済み: ${allRecords.length}件`,
    `ゴミ箱:   ${trashRecords.length}件`,
    '',
    'これらを保存済みの記録に移し、この画面から消します。',
    `患者IDの連番は1に戻り、翌日は ${festival.year}-${festival.day + 1}-001 から始まります。`,
  ];
  if (occupied > 0) {
    lines.push('',
      `⚠️ 入室中の枠が ${occupied} 件あります。`,
      'この患者は今日のIDを持ったまま翌日に残るため、番号が重複する可能性があります。',
      '先に退室処理をしてから締めることをおすすめします。');
  }
  lines.push('', '実行してよろしいですか？');
  if (!confirm(lines.join('\n'))) return;

  const btn = $c('btn-close-day');
  btn.disabled = true;
  try {
    // 保存・消去・採番リセット・日付繰り上げを1回の更新でまとめて行う
    const updates = {};
    updates['kyuugo/archives/' + key] = {
      year: festival.year,
      day: festival.day,
      label: `${festival.year}年 ${festival.day}日目`,
      archivedAt: Date.now(),
      archivedBy: me.name,
      dischargedCount: allRecords.length,
      trashCount: trashRecords.length,
      discharged: allRecords.length
        ? Object.fromEntries(allRecords.map(({_key, ...v}) => [_key, v])) : null,
      discharged_trash: trashRecords.length
        ? Object.fromEntries(trashRecords.map(({_key, ...v}) => [_key, v])) : null,
    };
    updates['kyuugo/discharged'] = null;
    updates['kyuugo/discharged_trash'] = null;
    updates['kyuugo/globalPatientId'] = 0;
    updates['kyuugo/festival/day'] = festival.day + 1;

    await trackWrite(update(ref(db), updates));
    logChange('日次の締め', `${festival.year}年 ${festival.day}日目`,
      `退室済み${allRecords.length}件 / ゴミ箱${trashRecords.length}件`);
    closeMsg(`${key} を保存しました。次の患者IDは ${festival.year}-${festival.day + 1}-001 からです。`, 'ok');
  } catch (e) {
    console.warn('closeDay:', e);
    closeMsg('締められませんでした: ' + (e.code || e.message), 'err');
  } finally {
    btn.disabled = false;
  }
}

async function saveFestival() {
  const y = Number($c('fest-year').value);
  const d = Number($c('fest-day').value);
  if (!Number.isInteger(y) || y < 2000 || y > 2100) { closeMsg('開催年が正しくありません。', 'err'); return; }
  if (!Number.isInteger(d) || d < 1 || d > 10)      { closeMsg('開催日が正しくありません。', 'err'); return; }
  try {
    await trackWrite(update(ref(db, 'kyuugo/festival'), {year: y, day: d}));
    logChange('開催年・日の変更', `${y}年 ${d}日目`, '');
    $c('fest-form').style.display = 'none';
    closeMsg(`開催年・日を ${y}年 ${d}日目 に変更しました。`, 'ok');
  } catch (e) {
    closeMsg('変更できませんでした: ' + (e.code || e.message), 'err');
  }
}

function setupCloseSection() {
  if (!me.admin) return;              // 締めは管理者のみ
  $c('close-section').style.display = '';

  // 採番の現在位置を見て、次に発行されるIDを出す
  onValue(ref(db, 'kyuugo/globalPatientId'), snap => {
    nextSeq = (Number(snap.val()) || 0) + 1;
    renderFestival();
  }, e => console.warn('globalPatientId:', e));

  $c('btn-close-day').addEventListener('click', closeDay);
  $c('fest-edit').addEventListener('click', () => {
    $c('fest-year').value = festival.year;
    $c('fest-day').value  = festival.day;
    $c('fest-form').style.display = '';
  });
  $c('fest-cancel').addEventListener('click', () => { $c('fest-form').style.display = 'none'; });
  $c('fest-save').addEventListener('click', saveFestival);
}

// ─── 起動（認証が通ってから） ─────────────────────────
requireAuth('📋 退室済み一覧', () => {
  document.getElementById('filter-outcome').innerHTML =
    `<option value="">全転帰</option>` + OUTCOMES.map(o => `<option>${o}</option>`).join('');
  if (me.admin) document.getElementById('csv-btn').style.display = '';
  subscribeFestival(renderFestival);
  setupCloseSection();
  subscribeAll();
});
</script>
