<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ユーザー管理 — 救護所</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;background:#f5f5f5;color:#333;font-size:14px}
.hdr{background:#fff;border-bottom:1px solid #e0e0e0;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.hdr-title{font-size:15px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back-link{font-size:12px;color:#3b82f6;text-decoration:none;padding:5px 10px;border:1px solid #93c5fd;border-radius:6px;background:#eff6ff;white-space:nowrap}
.back-link:hover{background:#dbeafe}
.content{padding:14px;max-width:720px;margin:0 auto}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:16px;margin-bottom:14px}
.card-h{font-size:14px;font-weight:600;margin-bottom:12px}
.hint{font-size:12px;color:#777;line-height:1.7;margin-bottom:12px}
.frm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inp{flex:1;min-width:170px;padding:9px 11px;border:1px solid #d0d0d0;border-radius:8px;font-size:14px;font-family:inherit}
.inp:focus{outline:none;border-color:#3b82f6}
.chk{display:flex;align-items:center;gap:5px;font-size:13px;color:#555;white-space:nowrap;cursor:pointer}
.btn{padding:9px 16px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:#3b82f6;color:#fff;white-space:nowrap}
.btn:hover{background:#2563eb}
.btn:disabled{opacity:.5;cursor:default}
.btn-danger{background:none;border:1px solid #f5c6c2;color:#b3261e;padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer}
.btn-danger:hover{background:#fdecea}
.btn-danger:disabled{opacity:.4;cursor:default}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;color:#888;font-weight:600;padding:6px 8px;border-bottom:1px solid #e8e8e8;white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid #f0f0f0;font-size:13px;vertical-align:middle;word-break:break-all}
.badge{display:inline-block;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:5px;padding:1px 7px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-plain{background:#f5f5f5;color:#777;border-color:#e0e0e0}
.self{font-size:11px;color:#999;margin-left:5px}
.empty{color:#999;font-size:13px;padding:16px 8px;text-align:center}
.msg{border-radius:8px;padding:9px 12px;font-size:12.5px;line-height:1.7;margin-bottom:12px;display:none;word-break:break-all}
.msg.err{background:#fdecea;border:1px solid #f5c6c2;color:#b3261e;display:block}
.msg.ok{background:#e8f5e9;border:1px solid #b7e0ba;color:#256029;display:block}
</style>
</head>
<body>

<div class="hdr">
  <a class="back-link" href="index.html">← 戻る</a>
  <span class="hdr-title">👥 ユーザー管理</span>
  <span class="hdr-user" id="hdr-user"></span>
  <button class="hdr-logout" id="hdr-logout" style="display:none">ログアウト</button>
</div>

<div class="content">
  <div class="card">
    <div class="card-h">ユーザーを追加</div>
    <div class="hint">
      Googleアカウントのメールアドレスを登録すると、そのアカウントでログインできるようになります。
      管理者はこの画面でユーザーを追加・削除できます。
    </div>
    <div class="msg" id="msg"></div>
    <div class="frm">
      <input class="inp" id="in-email" type="email" placeholder="メールアドレス" autocomplete="off">
      <input class="inp" id="in-name" type="text" placeholder="表示名（任意）" autocomplete="off">
      <label class="chk"><input type="checkbox" id="in-admin"> 管理者</label>
      <button class="btn" id="btn-add">追加</button>
    </div>
  </div>

  <div class="card">
    <div class="card-h">許可済みユーザー（<span id="count">0</span>人）</div>
    <div id="list-area"></div>
  </div>
</div>

<script type="module">
import { ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { db, me, emailKey, readProfile, requireAuth, logChange } from './app-common.js';

const $ = id => document.getElementById(id);

function showMsg(text, kind) {
  const el = $('msg');
  el.className = 'msg ' + kind;
  el.textContent = text;
}
function clearMsg() { $('msg').className = 'msg'; }

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 表示用に「,」を「.」へ戻す。@より後ろだけでなく全体が対象
const keyToEmail = k => k.replace(/,/g, '.');

let users = [];

function render() {
  const area = $('list-area');
  $('count').textContent = users.length;

  if (!users.length) {
    area.innerHTML = '<div class="empty">登録されているユーザーがいません</div>';
    return;
  }

  const rows = users.map(u => {
    const isSelf = u.email.toLowerCase() === me.email.toLowerCase();
    return `<tr>
      <td>${esc(u.name)}${isSelf ? '<span class="self">(自分)</span>' : ''}</td>
      <td>${esc(u.email)}</td>
      <td><span class="badge ${u.admin ? '' : 'badge-plain'}">${u.admin ? '管理者' : '一般'}</span></td>
      <td style="text-align:right">
        <button class="btn-danger" data-key="${esc(u.key)}" ${isSelf ? 'disabled title="自分自身は削除できません"' : ''}>削除</button>
      </td>
    </tr>`;
  }).join('');

  area.innerHTML = `<table>
    <thead><tr><th>表示名</th><th>メールアドレス</th><th>権限</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>`;

  area.querySelectorAll('.btn-danger').forEach(b =>
    b.addEventListener('click', () => removeUser(b.dataset.key)));
}

function subscribe() {
  onValue(ref(db, 'kyuugo/allowedUsers'), snap => {
    const data = snap.val() || {};
    users = Object.entries(data).map(([key, val]) => {
      const email = keyToEmail(key);
      const p = readProfile(val, email);
      return {key, email, name: p.name, admin: p.admin};
    }).sort((a, b) => (b.admin - a.admin) || a.email.localeCompare(b.email));
    render();
  }, e => {
    showMsg('ユーザー一覧を読み込めませんでした: ' + (e.code || e.message), 'err');
  });
}

async function addUser() {
  clearMsg();
  const email = $('in-email').value.trim().toLowerCase();
  const name  = $('in-name').value.trim();
  const admin = $('in-admin').checked;

  if (!email) { showMsg('メールアドレスを入力してください。', 'err'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showMsg('メールアドレスの形式が正しくありません。', 'err'); return;
  }
  const key = emailKey(email);
  if (users.some(u => u.key === key)) {
    showMsg('このメールアドレスは既に登録されています。', 'err'); return;
  }

  const btn = $('btn-add');
  btn.disabled = true;
  try {
    const payload = {name: name || email};
    if (admin) payload.admin = true;
    await set(ref(db, 'kyuugo/allowedUsers/' + key), payload);
    logChange('ユーザー追加', email, admin ? '管理者' : '一般');
    $('in-email').value = $('in-name').value = '';
    $('in-admin').checked = false;
    showMsg(email + ' を追加しました。', 'ok');
  } catch (e) {
    showMsg('追加できませんでした: ' + (e.code || e.message), 'err');
  } finally {
    btn.disabled = false;
  }
}

async function removeUser(key) {
  clearMsg();
  const u = users.find(x => x.key === key);
  if (!u) return;
  if (u.email.toLowerCase() === me.email.toLowerCase()) {
    showMsg('自分自身は削除できません。', 'err'); return;
  }
  if (!confirm(u.email + ' を許可リストから削除します。よろしいですか？')) return;

  try {
    await remove(ref(db, 'kyuugo/allowedUsers/' + key));
    logChange('ユーザー削除', u.email, u.admin ? '管理者' : '一般');
    showMsg(u.email + ' を削除しました。', 'ok');
  } catch (e) {
    showMsg('削除できませんでした: ' + (e.code || e.message), 'err');
  }
}

$('btn-add').addEventListener('click', addUser);
$('in-email').addEventListener('keydown', e => { if (e.key === 'Enter') addUser(); });
$('in-name').addEventListener('keydown', e => { if (e.key === 'Enter') addUser(); });

// 管理者のみ利用できる画面
requireAuth('👥 ユーザー管理', subscribe, true);
</script>
</body>
</html>
